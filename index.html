<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tauri + Vue 3 App</title>
</head>

<body>
  <div id="decorum-titlebar" data-tauri-decorum-tb aria-label="窗口标题栏">
    <div id="decorum-fullscreen-drag-region" data-tauri-drag-region aria-label="拖动窗口"></div>
    <div id="decorum-player-mount"></div>
  </div>
  <div id="app"></div>

  <script type="module" src="/src/main.js"></script>

</body>

</html>
<style>
  #decorum-titlebar {
    position: fixed;
    inset: 0 0 auto;
    z-index: 1100;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    width: 100%;
    height: 64px;
    overflow: hidden;
    color: rgb(var(--text-color, 245, 245, 245));
    background: transparent;
    box-shadow: none;
    backdrop-filter: blur(0);
    transition: background-color 220ms ease, box-shadow 220ms ease, backdrop-filter 220ms ease;
    will-change: background-color, box-shadow, backdrop-filter;
  }

  #decorum-titlebar.is-scrolled {
    background: color-mix(in srgb, rgba(var(--background-color, 20, 24, 27), 0.5) 94%, rgb(var(--global-color)) 6%);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
    backdrop-filter: blur(18px) saturate(1.12);
  }

  #decorum-titlebar.is-fullscreen {
    background: transparent;
    box-shadow: none;
    backdrop-filter: none;
  }

  #decorum-player-mount {
    position: relative;
    grid-column: 1 / -1;
    grid-row: 2;
    min-width: 0;
    height: 60px;
    overflow: hidden;
    z-index: 1;
  }

  #decorum-fullscreen-drag-region {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  #decorum-titlebar.is-fullscreen #decorum-fullscreen-drag-region {
    pointer-events: auto;
  }

  #decorum-titlebar>.decorum-tb-btn,
  #decorum-titlebar .decorum-tb-actions {
    height: 30px;
  }

  #decorum-titlebar>.decorum-tb-btn {
    position: absolute;
    right: 0;
    width: 52px;
    z-index: 2;
  }

  #decorum-titlebar>.decorum-tb-btn:nth-of-type(1) {
    right: 104px;
  }

  #decorum-titlebar>.decorum-tb-btn:nth-of-type(2) {
    right: 52px;
  }

  #decorum-titlebar>.decorum-tb-btn:nth-of-type(3) {
    right: 0;
  }

  #decorum-titlebar .decorum-tb-actions {
    position: absolute;
    top: 4px;
    right: 0;
    align-items: stretch;
    padding-right: 0;
    gap: 0;
    z-index: 2;
  }

  #decorum-titlebar .decorum-tb-actions .decorum-tb-btn {
    width: 52px;
    height: 30px;
  }

  #decorum-titlebar.is-fullscreen #decorum-player-mount {
    pointer-events: none;
  }

  #decorum-titlebar.is-fullscreen>.decorum-tb-btn,
  #decorum-titlebar.is-fullscreen .decorum-tb-actions,
  #decorum-titlebar.is-fullscreen .decorum-tb-actions .decorum-tb-btn {
    pointer-events: auto;
  }

  .decorum-tb-btn {
    font-synthesis: none;
    -webkit-text-size-adjust: 100%;
    color: rgb(var(--global-inverse-color));
    cursor: default;
    width: 52px;
    height: 30px;
    border: none;
    padding: 0px;
    outline: none;
    display: flex;
    font-size: 10px;
    font-weight: 300;
    box-shadow: none;
    border-radius: 0;
    align-items: center;
    justify-content: center;
    transition: background 0.1s;
    background-color: transparent;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    font-family: 'Segoe Fluent Icons', 'Segoe MDL2 Assets';
  }
</style>
